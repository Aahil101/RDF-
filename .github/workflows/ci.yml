name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Test suite
        env:
          PYTHONIOENCODING: utf-8
        run: pytest -q

  pipeline:
    name: end-to-end pipeline + metrics gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Generate the sample corpus
        run: python -m scripts.make_sample_pdfs

      - name: Index it
        run: python cli.py --provider extractive ingest data/raw

      - name: Answer a question with proof
        env:
          PYTHONIOENCODING: utf-8
        run: python cli.py --provider extractive ask "What is the monthly rent and the lock-in period?" --trace

      - name: Evaluate
        env:
          PYTHONIOENCODING: utf-8
        run: python cli.py --provider extractive eval --json eval_report.json

      # Fails the build if retrieval or grounding regresses. Thresholds sit just
      # below the measured baseline so real regressions surface, without the
      # build breaking on run-to-run noise.
      - name: Enforce quality gates
        run: |
          python - <<'PY'
          import json, sys

          report = json.load(open("eval_report.json"))
          gates = {
              ("retrieval", "recall@5"): 0.90,
              ("retrieval", "mrr"): 0.75,
              ("answers", "answer_accuracy"): 0.85,
              ("answers", "mean_groundedness"): 0.90,
          }
          failures = []
          for (section, metric), floor in gates.items():
              value = report.get(section, {}).get(metric)
              if value is None:
                  failures.append(f"{section}.{metric} missing from report")
              elif value < floor:
                  failures.append(f"{section}.{metric} = {value:.3f} < {floor:.2f}")
              else:
                  print(f"ok  {section}.{metric} = {value:.3f} >= {floor:.2f}")

          max_false_refusal = 0.05
          false_refusal = report.get("refusal", {}).get("false_refusal_rate", 1.0)
          if false_refusal > max_false_refusal:
              failures.append(f"refusal.false_refusal_rate = {false_refusal:.3f} > {max_false_refusal}")
          else:
              print(f"ok  refusal.false_refusal_rate = {false_refusal:.3f} <= {max_false_refusal}")

          if failures:
              print("\nQUALITY GATE FAILED")
              for line in failures:
                  print("  -", line)
              sys.exit(1)
          print("\nall quality gates passed")
          PY

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.json

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t verirag:ci .
      - name: Smoke test inside the image
        run: docker run --rm verirag:ci python cli.py --provider extractive stats
